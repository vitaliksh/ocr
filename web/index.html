<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>חילוץ נתוני מסמכים</title><link rel="stylesheet" href="styles.css?v=6"></head><body><main><header><h1>חילוץ נתונים מחשבוניות וקבלות</h1><p>חילוץ בלבד בעזרת Gemini — ללא סיווג הנהלת חשבונות.</p><p class="format-note">JSON format v4: invoices[] → field → value + evidence</p></header><section class="upload card"><label for="model">מודל Gemini</label><select id="model"><option value="gemini-3.6-flash">gemini-3.6-flash</option><option value="gemini-3.5-flash">gemini-3.5-flash</option><option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option><option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option></select><label for="image">תמונות מסמכים (JPG / PNG)</label><input id="image" type="file" accept="image/jpeg,image/png" multiple><div id="previews" class="previews"></div><div class="actions"><button id="recognize" type="button" disabled>זיהוי ושמירה</button><button id="stop" type="button" hidden disabled>עצור</button></div><p id="status" role="status"></p></section><section id="results" hidden></section></main><template id="document-template"><article class="document card"><div class="document-heading"><h2></h2><span class="outcome"></span></div><img class="document-preview"><form class="fields"></form><div class="actions"><button class="save" type="button">שמור עריכות</button><span class="save-status" role="status"></span></div><details><summary>JSON v4</summary><pre class="json"></pre></details></article></template><script src="app.js?v=6"></script></body></html>
