<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>תמונות ל-Rivhit</title><link rel="stylesheet" href="styles.css?v=9"></head><body><main><header><h1>תמונות חשבוניות ל-Rivhit</h1><p>Gemini מעבד כל תמונה פעם אחת בלבד ומייצר שורות ייבוא Rivhit ישירות.</p><p class="format-note">6111 → Rivhit נקבע לפי טבלת ההמרה המקומית.</p></header><section class="upload card"><label for="business-activity">סוג פעילות העסק</label><textarea id="business-activity" rows="2" required>שיערי ספורט ופולטיס פרטיים</textarea><label for="model">מודל Gemini</label><select id="model"><option value="gemini-3.6-flash">gemini-3.6-flash</option><option value="gemini-3.5-flash">gemini-3.5-flash</option><option value="gemini-3.1-pro-preview">gemini-3.1-pro-preview</option><option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite</option></select><label for="image">תמונות מסמכים (JPG / PNG)</label><input id="image" type="file" accept="image/jpeg,image/png" multiple><div id="previews" class="previews"></div><div class="actions"><button id="recognize" type="button" disabled>עבד לבדיקה</button><button id="export-rivhit" type="button" hidden disabled>צור TXT מהשורות שנבחרו</button><button id="stop" type="button" hidden disabled>עצור</button></div><p id="status" role="status"></p></section><section id="results" hidden></section></main><template id="record-template"><article class="document card"><div class="document-heading"><h2></h2><span class="outcome">נוצרה שורת Rivhit</span></div><dl class="record-values"></dl><p class="warnings"></p><details><summary>נתוני מקור</summary><pre class="json"></pre></details></article></template><script src="app.js?v=9"></script></body></html>
